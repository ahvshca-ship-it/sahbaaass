<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول | Sahba</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --dark: #111827;
      --gold: #f59e0b;
      --gold-light: #fff7df;
      --gray: #f7f8fa;
      --text: #111827;
      --muted: #667085;
      --border: #d0d5dd;
    }

    body {
      font-family: Arial, "Tahoma", sans-serif;
      background:
        radial-gradient(
          circle at top right,
          rgba(245,158,11,.12),
          transparent 35%
        ),
        var(--gray);

      color: var(--text);
      min-height: 100vh;

      display: flex;
      flex-direction: column;
    }

    /* ================= HEADER ================= */

    header {
      background: var(--dark);
      color: white;

      padding: 16px 7%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      box-shadow: 0 4px 20px rgba(0,0,0,.12);
    }

    .logo {
      font-size: 30px;
      font-weight: 900;
      color: var(--gold);
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 15px;
      transition: .2s;
    }

    .back:hover {
      color: var(--gold);
    }

    /* ================= LOGIN ================= */

    main {
      flex: 1;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 50px 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;

      background: white;

      padding: 35px;

      border-radius: 22px;

      border: 1px solid #e5e7eb;

      box-shadow:
        0 15px 45px rgba(0,0,0,.08);
    }

    .login-logo {
      text-align: center;

      font-size: 38px;
      font-weight: 900;

      color: var(--gold);

      margin-bottom: 5px;
    }

    .login-title {
      text-align: center;

      font-size: 26px;

      margin-bottom: 8px;
    }

    .login-description {
      text-align: center;

      color: var(--muted);

      font-size: 14px;

      margin-bottom: 28px;
    }

    /* ================= FORM ================= */

    label {
      display: block;

      font-weight: bold;

      margin-bottom: 7px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    input {
      width: 100%;

      padding: 14px;

      border: 1px solid var(--border);

      border-radius: 11px;

      font-size: 16px;

      outline: none;

      transition: .2s;
    }

    input:focus {
      border-color: var(--gold);

      box-shadow:
        0 0 0 3px rgba(245,158,11,.12);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-left: 55px;
    }

    .show-password {
      position: absolute;

      left: 10px;
      top: 50%;

      transform: translateY(-50%);

      border: none;

      background: transparent;

      color: var(--muted);

      padding: 5px;

      font-size: 13px;

      cursor: pointer;
    }

    /* ================= OPTIONS ================= */

    .options {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin: 5px 0 22px;

      font-size: 13px;
    }

    .remember {
      display: flex;

      align-items: center;

      gap: 6px;

      color: var(--muted);
    }

    .remember input {
      width: auto;
    }

    .forgot {
      color: #b36b00;

      text-decoration: none;
    }

    /* ================= BUTTON ================= */

    .login-btn {
      width: 100%;

      border: none;

      background: var(--gold);

      color: var(--dark);

      padding: 14px;

      border-radius: 11px;

      font-size: 16px;

      font-weight: 900;

      cursor: pointer;

      transition: .2s;
    }

    .login-btn:hover {
      background: #fbbf24;

      transform: translateY(-1px);
    }

    /* ================= DIVIDER ================= */

    .divider {
      display: flex;

      align-items: center;

      gap: 12px;

      color: #98a2b3;

      font-size: 13px;

      margin: 25px 0;
    }

    .divider::before,
    .divider::after {
      content: "";

      flex: 1;

      height: 1px;

      background: #e5e7eb;
    }

    /* ================= REGISTER ================= */

    .register {
      text-align: center;

      color: var(--muted);

      font-size: 14px;
    }

    .register a {
      color: #b36b00;

      font-weight: bold;

      text-decoration: none;
    }

    .register a:hover {
      text-decoration: underline;
    }

    /* ================= FOOTER ================= */

    footer {
      background: var(--dark);

      color: white;

      text-align: center;

      padding: 22px;
    }

    footer p {
      color: #98a2b3;

      font-size: 13px;
    }

    /* ================= MOBILE ================= */

    @media(max-width: 500px) {

      header {
        padding: 14px 5%;
      }

      .logo {
        font-size: 27px;
      }

      .login-box {
        padding: 27px 20px;
      }

      .login-title {
        font-size: 23px;
      }

    }

  </style>
</head>


<body>


<!-- ================= HEADER ================= -->

<header>

  <a href="index.html" class="logo">
    Sahba
  </a>

  <a href="index.html" class="back">
    ← العودة للرئيسية
  </a>

</header>


<!-- ================= LOGIN ================= -->

<main>

  <div class="login-box">


    <div class="login-logo">
      Sahba
    </div>


    <h1 class="login-title">
      تسجيل الدخول
    </h1>


    <p class="login-description">
      ادخل حسابك لمتابعة مشاركاتك وتذاكرك
    </p>


    <form onsubmit="login(event)">


      <!-- PHONE -->

      <div class="input-group">

        <label for="phone">
          رقم الهاتف
        </label>

        <input
          id="phone"
          type="tel"
          placeholder="01xxxxxxxxx"
          maxlength="11"
          required
        >

      </div>


      <!-- PASSWORD -->

      <div class="input-group">

        <label for="password">
          كلمة المرور
        </label>

        <div class="password-wrapper">

          <input
            id="password"
            type="password"
            placeholder="••••••••"
            required
          >

          <button
            type="button"
            class="show-password"
            onclick="togglePassword()"
          >
            إظهار
          </button>

        </div>

      </div>


      <!-- OPTIONS -->

      <div class="options">

        <label class="remember">

          <input
            type="checkbox"
            id="remember"
          >

          تذكرني

        </label>


        <a href="#" class="forgot">
          نسيت كلمة المرور؟
        </a>

      </div>


      <!-- LOGIN BUTTON -->

      <button
        type="submit"
        class="login-btn"
      >
        تسجيل الدخول
      </button>


    </form>


    <div class="divider">
      أو
    </div>


    <div class="register">

      ليس لديك حساب؟

      <a href="register.html">
        إنشاء حساب جديد
      </a>

    </div>


  </div>

</main>


<!-- ================= FOOTER ================= -->

<footer>

  <p>
    © 2026 Sahba — جميع الحقوق محفوظة
  </p>

</footer>


<!-- ================= JAVASCRIPT ================= -->

<script>

  function togglePassword() {

    const password =
      document.getElementById("password");

    const button =
      document.querySelector(".show-password");


    if (password.type === "password") {

      password.type = "text";

      button.textContent = "إخفاء";

    } else {

      password.type = "password";

      button.textContent = "إظهار";

    }

  }


  function login(event) {

    event.preventDefault();


    const phone =
      document.getElementById("phone").value;

    const password =
      document.getElementById("password").value;


    if (!phone || !password) {

      alert("من فضلك أكمل البيانات.");

      return;

    }


    /*
      تسجيل الدخول الحقيقي
      هنربطه بقاعدة البيانات في مرحلة الـBackend.
    */

    alert(
      "تم إرسال بيانات تسجيل الدخول بنجاح."
    );

  }

</script>


</body>
</html>
