<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إيداع رصيد | Sahba</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #f7f8fa;
      color: #111827;
      line-height: 1.7;
    }

    a {
      text-decoration: none;
    }

    /* ===== HEADER ===== */

    header {
      background: #111827;
      color: white;
      padding: 16px 7%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      position: sticky;
      top: 0;
      z-index: 1000;

      box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }

    .logo {
      color: #f59e0b;
      font-size: 30px;
      font-weight: bold;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    nav a {
      color: white;
      padding: 8px 10px;
      font-size: 15px;
    }

    nav a:hover {
      color: #f59e0b;
    }

    .back-btn {
      border: 1px solid #f59e0b;
      border-radius: 9px;
      color: #f59e0b !important;
      padding: 8px 17px !important;
    }

    .back-btn:hover {
      background: #f59e0b;
      color: #111827 !important;
    }

    /* ===== PAGE HEADER ===== */

    .page-header {
      padding: 60px 7% 45px;
      text-align: center;

      background:
        radial-gradient(
          circle at top right,
          rgba(245,158,11,.16),
          transparent 35%
        ),
        linear-gradient(135deg, #fff7df, #ffffff);
    }

    .badge {
      display: inline-block;
      background: white;
      color: #9a6700;
      border: 1px solid #f2d58a;
      padding: 6px 15px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .page-header h1 {
      font-size: clamp(32px, 5vw, 45px);
      margin-bottom: 8px;
    }

    .page-header p {
      color: #667085;
      font-size: 16px;
    }

    /* ===== MAIN ===== */

    main {
      max-width: 760px;
      margin: auto;
      padding: 45px 20px 70px;
    }

    /* ===== FORM CARD ===== */

    .form-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 7px 30px rgba(0,0,0,.06);
    }

    .form-intro {
      text-align: center;
      color: #667085;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .current-balance {
      background: #111827;
      color: white;

      border-radius: 14px;
      padding: 18px 20px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 25px;
    }

    .current-balance span {
      color: #d0d5dd;
      font-size: 13px;
    }

    .current-balance strong {
      color: #f59e0b;
      font-size: 20px;
    }

    /* ===== FORM ===== */

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin-top: 15px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;

      margin: 8px 0 5px;

      border: 1px solid #d0d5dd;
      border-radius: 10px;

      font-size: 16px;

      outline: none;
      background: white;
    }

    input:focus,
    select:focus {
      border-color: #f59e0b;

      box-shadow:
        0 0 0 3px rgba(245,158,11,.12);
    }

    .hint {
      color: #98a2b3;
      font-size: 12px;
      margin-bottom: 8px;
    }

    /* ===== PAYMENT METHODS ===== */

    .methods {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;

      margin-top: 8px;
    }

    .method {
      position: relative;
    }

    .method input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .method label {
      margin: 0;

      display: block;

      padding: 15px;

      border: 1px solid #e5e7eb;

      border-radius: 12px;

      cursor: pointer;

      text-align: center;

      color: #111827;

      transition: .2s;
    }

    .method label:hover {
      border-color: #f2d58a;
    }

    .method input:checked + label {
      border-color: #f59e0b;
      background: #fff7df;
      color: #9a6700;
    }

    /* ===== BUTTON ===== */

    .submit-btn {
      width: 100%;

      border: none;

      background: #f59e0b;
      color: #111827;

      padding: 14px;

      border-radius: 11px;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      margin-top: 22px;

      transition: .2s;
    }

    .submit-btn:hover {
      background: #fbbf24;
      transform: translateY(-1px);
    }

    /* ===== MESSAGE ===== */

    .message {
      display: none;

      margin-top: 15px;

      padding: 12px;

      border-radius: 10px;

      text-align: center;

      font-size: 13px;
    }

    .success {
      background: #ecfdf3;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    /* ===== FOOTER ===== */

    footer {
      background: #111827;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    footer .logo {
      display: inline-block;
      margin-bottom: 8px;
    }

    footer p {
      color: #98a2b3;
      font-size: 14px;
    }

    .footer-links {
      margin-top: 15px;
    }

    .footer-links a {
      color: #d0d5dd;
      font-size: 13px;
      margin: 0 8px;
    }

    .footer-links a:hover {
      color: #f59e0b;
    }

    /* ===== MOBILE ===== */

    @media (max-width: 800px) {

      header {
        padding: 14px 5%;
      }

      .logo {
        font-size: 27px;
      }

      nav a:not(.back-btn) {
        display: none;
      }

      .page-header {
        padding: 50px 5% 35px;
      }

      main {
        padding: 35px 15px 55px;
      }

      .form-card {
        padding: 22px 18px;
      }

      .methods {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>

<body>


  <!-- HEADER -->

  <header>

    <a href="index.html" class="logo">
      Sahba
    </a>

    <nav>

      <a href="wallet.html">
        المحفظة
      </a>

      <a href="account.html" class="back-btn">
        ← حسابي
      </a>

    </nav>

  </header>


  <!-- PAGE HEADER -->

  <section class="page-header">

    <div class="badge">
      Sahba Wallet
    </div>

    <h1>
      إيداع رصيد
    </h1>

    <p>
      أضف رصيدًا إلى محفظتك لاستخدام خدمات Sahba.
    </p>

  </section>


  <!-- MAIN -->

  <main>

    <div class="form-card">

      <p class="form-intro">
        أدخل المبلغ واختر طريقة الإيداع المناسبة لك.
      </p>


      <!-- CURRENT BALANCE -->

      <div class="current-balance">

        <span>
          الرصيد الحالي
        </span>

        <strong>
          0.00 جنيه
        </strong>

      </div>


      <!-- AMOUNT -->

      <label for="amount">
        مبلغ الإيداع
      </label>

      <input
        id="amount"
        type="number"
        min="1"
        placeholder="مثال: 500"
      >

      <p class="hint">
        أدخل المبلغ بالجنيه المصري.
      </p>


      <!-- METHOD -->

      <label>
        طريقة الإيداع
      </label>

      <div class="methods">


        <div class="method">

          <input
            type="radio"
            name="method"
            id="method1"
            value="wallet"
            checked
          >

          <label for="method1">
            تحويل إلكتروني
          </label>

        </div>


        <div class="method">

          <input
            type="radio"
            name="method"
            id="method2"
            value="bank"
          >

          <label for="method2">
            تحويل بنكي
          </label>

        </div>


      </div>


      <!-- SUBMIT -->

      <button
        type="button"
        class="submit-btn"
        onclick="submitDeposit()"
      >
        متابعة الإيداع
      </button>


      <div
        class="message success"
        id="successMessage"
      >
        تم إرسال طلب الإيداع بنجاح وسيتم مراجعته.
      </div>


    </div>

  </main>


  <!-- FOOTER -->

  <footer>

    <div class="logo">
      Sahba
    </div>

    <p>
      منصة Sahba
    </p>

    <div class="footer-links">

      <a href="#">
        الشروط والأحكام
      </a>

      <a href="#">
        سياسة الخصوصية
      </a>

      <a href="#">
        تواصل معنا
      </a>

    </div>

  </footer>


  <script>

    function submitDeposit() {

      const amount =
        document.getElementById("amount").value;

      if (!amount || Number(amount) <= 0) {

        alert("من فضلك أدخل مبلغ إيداع صحيح.");

        return;

      }


      document.getElementById(
        "successMessage"
      ).style.display = "block";

    }

  </script>


</body>
</html>
