<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>نسيت كلمة المرور | Sahba</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;

      background:
        radial-gradient(
          circle at top right,
          rgba(245,158,11,.12),
          transparent 35%
        ),
        #f7f8fa;

      color: #111827;

      min-height: 100vh;

      display: flex;
      flex-direction: column;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: #111827;

      padding: 16px 7%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }

    .logo {
      color: #f59e0b;

      font-size: 30px;

      font-weight: bold;

      text-decoration: none;
    }

    .back {
      color: white;

      text-decoration: none;

      font-size: 14px;
    }

    .back:hover {
      color: #f59e0b;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      flex: 1;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 45px 20px;
    }

    .box {
      width: 100%;

      max-width: 450px;

      background: white;

      border: 1px solid #e5e7eb;

      border-radius: 22px;

      padding: 35px;

      box-shadow:
        0 12px 40px rgba(0,0,0,.07);

      text-align: center;
    }

    .icon {
      width: 70px;
      height: 70px;

      margin: 0 auto 18px;

      border-radius: 50%;

      background: #fff7df;

      display: flex;

      align-items: center;

      justify-content: center;
    }

    .icon svg {
      width: 34px;
      height: 34px;

      fill: none;

      stroke: #9a6700;

      stroke-width: 1.6;

      stroke-linecap: round;

      stroke-linejoin: round;
    }

    h1 {
      font-size: 27px;

      margin-bottom: 10px;
    }

    .description {
      color: #667085;

      font-size: 14px;

      line-height: 1.8;

      margin-bottom: 25px;
    }

    /* =========================
       FORM
    ========================= */

    .form {
      text-align: right;
    }

    label {
      display: block;

      font-size: 14px;

      font-weight: bold;

      margin-bottom: 7px;
    }

    input {
      width: 100%;

      padding: 13px;

      border: 1px solid #d0d5dd;

      border-radius: 10px;

      font-family: inherit;

      font-size: 15px;

      outline: none;

      margin-bottom: 16px;
    }

    input:focus {
      border-color: #f59e0b;

      box-shadow:
        0 0 0 3px rgba(245,158,11,.12);
    }

    .submit-btn {
      width: 100%;

      border: none;

      background: #f59e0b;

      color: #111827;

      padding: 14px;

      border-radius: 11px;

      font-family: inherit;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      transition: .2s;
    }

    .submit-btn:hover {
      background: #fbbf24;

      transform: translateY(-1px);
    }

    /* =========================
       MESSAGE
    ========================= */

    .message {
      display: none;

      margin-top: 17px;

      padding: 11px;

      border-radius: 10px;

      text-align: center;

      font-size: 13px;
    }

    .error {
      background: #fef2f2;

      color: #b91c1c;
    }

    .success {
      background: #ecfdf3;

      color: #15803d;
    }

    /* =========================
       LOGIN
    ========================= */

    .login-link {
      display: block;

      margin-top: 20px;

      color: #667085;

      font-size: 13px;

      text-decoration: none;
    }

    .login-link span {
      color: #9a6700;

      font-weight: bold;
    }

    .login-link:hover span {
      text-decoration: underline;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #111827;

      color: white;

      text-align: center;

      padding: 25px 20px;
    }

    footer p {
      color: #98a2b3;

      font-size: 13px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 500px) {

      header {
        padding: 14px 5%;
      }

      .logo {
        font-size: 27px;
      }

      .box {
        padding: 28px 20px;
      }

      h1 {
        font-size: 24px;
      }

    }

  </style>

</head>


<body>


  <!-- HEADER -->

  <header>

    <a href="index.html" class="logo">
      Sahba
    </a>

    <a href="login.html" class="back">
      العودة لتسجيل الدخول
    </a>

  </header>


  <!-- MAIN -->

  <main>

    <div class="box">


      <!-- ICON -->

      <div class="icon">

        <svg viewBox="0 0 24 24">

          <rect
            x="3"
            y="11"
            width="18"
            height="10"
            rx="2"
          ></rect>

          <path
            d="M7 11V7a5 5 0 0110 0v4"
          ></path>

          <circle
            cx="12"
            cy="16"
            r="1"
          ></circle>

        </svg>

      </div>


      <h1>
        نسيت كلمة المرور؟
      </h1>


      <p class="description">
        اكتب رقم الهاتف المرتبط بحسابك،
        وسنرسل لك خطوات إعادة تعيين كلمة المرور.
      </p>


      <div class="form">


        <label>
          رقم الهاتف
        </label>


        <input
          type="tel"
          id="phone"
          inputmode="numeric"
          placeholder="01xxxxxxxxx"
        >


        <button
          type="button"
          class="submit-btn"
          onclick="sendReset()"
        >
          متابعة
        </button>


      </div>


      <div
        class="message error"
        id="errorMessage"
      ></div>


      <div
        class="message success"
        id="successMessage"
      ></div>


      <a
        href="login.html"
        class="login-link"
      >
        تذكرت كلمة المرور؟
        <span>
          تسجيل الدخول
        </span>
      </a>


    </div>

  </main>


  <!-- FOOTER -->

  <footer>

    <p>
      © 2026 Sahba — جميع الحقوق محفوظة
    </p>

  </footer>


  <script>

    function sendReset() {

      const phone =
        document.getElementById("phone")
        .value
        .trim();


      hideMessages();


      if (!phone) {

        showError(
          "من فضلك أدخل رقم الهاتف."
        );

        return;

      }


      if (!/^01[0-9]{9}$/.test(phone)) {

        showError(
          "من فضلك أدخل رقم هاتف مصري صحيح."
        );

        return;

      }


      /*
        حاليًا لا يوجد Backend.

        سنحفظ الرقم مؤقتًا حتى نربط
        صفحة إعادة تعيين كلمة المرور.

        لاحقًا سيتم إرسال OTP حقيقي.
      */

      sessionStorage.setItem(
        "sahba_reset_phone",
        phone
      );


      showSuccess(
        "تم العثور على الرقم. سيتم الانتقال لإعادة تعيين كلمة المرور."
      );


      setTimeout(function() {

        window.location.href =
          "reset-password.html";

      }, 1000);

    }


    function showError(message) {

      const box =
        document.getElementById(
          "errorMessage"
        );

      box.textContent = message;

      box.style.display = "block";

      document.getElementById(
        "successMessage"
      ).style.display = "none";

    }


    function showSuccess(message) {

      const box =
        document.getElementById(
          "successMessage"
        );

      box.textContent = message;

      box.style.display = "block";

      document.getElementById(
        "errorMessage"
      ).style.display = "none";

    }


    function hideMessages() {

      document.getElementById(
        "errorMessage"
      ).style.display = "none";

      document.getElementById(
        "successMessage"
      ).style.display = "none";

    }

  </script>


</body>

</html>
