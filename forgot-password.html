<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>نسيت كلمة المرور | Sahba</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --dark: #111827;
      --gold: #f59e0b;
      --gold-hover: #fbbf24;
      --gold-light: #fff7df;
      --gray: #f7f8fa;
      --text: #111827;
      --muted: #667085;
      --border: #d0d5dd;
      --red: #b91c1c;
      --red-bg: #fef2f2;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;

      background:
        radial-gradient(
          circle at top right,
          rgba(245,158,11,.12),
          transparent 35%
        ),
        var(--gray);

      color: var(--text);

      min-height: 100vh;

      display: flex;
      flex-direction: column;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: var(--dark);

      padding: 16px 7%;

      display: flex;

      justify-content: space-between;

      align-items: center;

      box-shadow: 0 4px 20px rgba(0,0,0,.12);
    }

    .logo {
      color: var(--gold);

      font-size: 30px;

      font-weight: 900;

      text-decoration: none;
    }

    .back {
      color: white;

      text-decoration: none;

      font-size: 14px;
    }

    .back:hover {
      color: var(--gold);
    }

    /* =========================
       MAIN
    ========================= */

    main {
      flex: 1;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 45px 20px;
    }

    .forgot-box {
      width: 100%;

      max-width: 470px;

      background: white;

      padding: 35px;

      border-radius: 22px;

      border: 1px solid #e5e7eb;

      box-shadow:
        0 15px 45px rgba(0,0,0,.08);
    }

    /* =========================
       ICON
    ========================= */

    .icon-box {
      width: 72px;

      height: 72px;

      margin: 0 auto 18px;

      border-radius: 50%;

      background: var(--gold-light);

      display: flex;

      justify-content: center;

      align-items: center;
    }

    .icon-box svg {
      width: 35px;

      height: 35px;

      fill: none;

      stroke: #9a6700;

      stroke-width: 1.7;

      stroke-linecap: round;

      stroke-linejoin: round;
    }

    /* =========================
       TITLE
    ========================= */

    h1 {
      text-align: center;

      font-size: 27px;

      margin-bottom: 10px;
    }

    .description {
      text-align: center;

      color: var(--muted);

      font-size: 14px;

      line-height: 1.8;

      margin-bottom: 28px;
    }

    /* =========================
       FORM
    ========================= */

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;

      font-weight: bold;

      font-size: 14px;

      margin-bottom: 7px;
    }

    input {
      width: 100%;

      padding: 14px;

      border: 1px solid var(--border);

      border-radius: 11px;

      font-family: inherit;

      font-size: 16px;

      outline: none;

      direction: ltr;

      text-align: right;

      background: white;
    }

    input:focus {
      border-color: var(--gold);

      box-shadow:
        0 0 0 3px rgba(245,158,11,.12);
    }

    .note {
      color: var(--muted);

      font-size: 12px;

      margin-top: 6px;

      line-height: 1.6;
    }

    /* =========================
       BUTTON
    ========================= */

    .main-btn {
      width: 100%;

      border: none;

      background: var(--gold);

      color: var(--dark);

      padding: 14px;

      border-radius: 11px;

      font-family: inherit;

      font-size: 16px;

      font-weight: 900;

      cursor: pointer;

      transition: .2s;
    }

    .main-btn:hover {
      background: var(--gold-hover);

      transform: translateY(-1px);
    }

    .main-btn:disabled {
      opacity: .6;

      cursor: not-allowed;

      transform: none;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message {
      display: none;

      margin-top: 17px;

      padding: 11px;

      border-radius: 10px;

      text-align: center;

      font-size: 13px;

      line-height: 1.6;
    }

    .error {
      background: var(--red-bg);

      color: var(--red);
    }

    /* =========================
       LOGIN
    ========================= */

    .login-link {
      display: block;

      text-align: center;

      margin-top: 22px;

      color: var(--muted);

      font-size: 13px;

      text-decoration: none;
    }

    .login-link strong {
      color: #9a6700;
    }

    .login-link:hover strong {
      text-decoration: underline;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      background: var(--dark);

      color: white;

      text-align: center;

      padding: 22px;
    }

    footer p {
      color: #98a2b3;

      font-size: 13px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:500px) {

      header {
        padding: 14px 5%;
      }

      .logo {
        font-size: 27px;
      }

      .forgot-box {
        padding: 28px 20px;
      }

      h1 {
        font-size: 24px;
      }

    }

  </style>

</head>


<body>


  <!-- HEADER -->

  <header>

    <a href="index.html" class="logo">
      Sahba
    </a>

    <a href="login.html" class="back">
      ← تسجيل الدخول
    </a>

  </header>


  <!-- MAIN -->

  <main>

    <div class="forgot-box">


      <!-- ICON -->

      <div class="icon-box">

        <svg viewBox="0 0 24 24">

          <rect
            x="3"
            y="11"
            width="18"
            height="10"
            rx="2"
          ></rect>

          <path
            d="M7 11V7a5 5 0 0110 0v4"
          ></path>

          <circle
            cx="12"
            cy="16"
            r="1"
          ></circle>

        </svg>

      </div>


      <!-- TITLE -->

      <h1>
        نسيت كلمة المرور؟
      </h1>


      <p class="description">
        أدخل رقم الهاتف المرتبط بحسابك،
        <br>
        وسنرسل لك كود تحقق عبر واتساب.
      </p>


      <!-- FORM -->

      <div class="input-group">

        <label for="phone">
          رقم الهاتف / واتساب
        </label>

        <input
          id="phone"
          type="tel"
          inputmode="numeric"
          maxlength="11"
          autocomplete="tel"
          placeholder="01xxxxxxxxx"
        >

        <div class="note">
          سيتم استخدام الرقم فقط لإرسال كود التحقق.
        </div>

      </div>


      <!-- BUTTON -->

      <button
        type="button"
        class="main-btn"
        id="sendButton"
        onclick="sendOTP()"
      >
        إرسال كود التحقق
      </button>


      <!-- ERROR -->

      <div
        class="message error"
        id="errorMessage"
      ></div>


      <!-- LOGIN -->

      <a
        href="login.html"
        class="login-link"
      >
        تذكرت كلمة المرور؟
        <strong>
          تسجيل الدخول
        </strong>
      </a>


    </div>

  </main>


  <!-- FOOTER -->

  <footer>

    <p>
      © 2026 Sahba — جميع الحقوق محفوظة
    </p>

  </footer>


  <script>

    /* =========================
       إرسال OTP
    ========================= */

    function sendOTP() {

      const phone =
        document
          .getElementById("phone")
          .value
          .trim();

      const button =
        document.getElementById("sendButton");


      hideError();


      /* التحقق من الرقم */

      if (!/^01[0-9]{9}$/.test(phone)) {

        showError(
          "من فضلك أدخل رقم موبايل مصري صحيح."
        );

        return;

      }


      /*
        نحفظ الرقم مؤقتًا.

        مهم:
        لا يتم اعتبار الرقم موثقًا هنا.

        عند ربط الـBackend سيتم:
        1- التأكد أن الحساب موجود.
        2- إنشاء OTP.
        3- إرسال OTP عبر WhatsApp.
        4- إنشاء جلسة استعادة آمنة.
      */

      sessionStorage.setItem(
        "sahba_reset_phone",
        phone
      );


      /*
        مؤقتًا ننتقل للصفحة التالية.

        بعد ربط الـBackend:
        يجب الانتقال فقط بعد نجاح
        طلب إرسال OTP.
      */

      button.disabled = true;

      button.textContent =
        "جاري المتابعة...";


      setTimeout(function() {

        window.location.href =
          "reset-password.html";

      }, 500);

    }


    /* =========================
       ERROR
    ========================= */

    function showError(message) {

      const box =
        document.getElementById(
          "errorMessage"
        );

      box.textContent = message;

      box.style.display = "block";

    }


    function hideError() {

      document.getElementById(
        "errorMessage"
      ).style.display = "none";

    }

  </script>


</body>

</html>
