<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إعادة تعيين كلمة المرور | Sahba</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --dark: #111827;
      --gold: #f59e0b;
      --gold-light: #fff7df;
      --gray: #f7f8fa;
      --text: #111827;
      --muted: #667085;
      --border: #d0d5dd;
      --green: #15803d;
      --green-light: #ecfdf3;
      --red: #b91c1c;
      --red-light: #fef2f2;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;

      background:
        radial-gradient(
          circle at top right,
          rgba(245,158,11,.12),
          transparent 35%
        ),
        var(--gray);

      color: var(--text);

      min-height: 100vh;

      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    header {
      background: var(--dark);

      padding: 16px 7%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      box-shadow: 0 4px 20px rgba(0,0,0,.12);
    }

    .logo {
      color: var(--gold);

      font-size: 30px;

      font-weight: 900;

      text-decoration: none;
    }

    .back {
      color: white;

      text-decoration: none;

      font-size: 14px;
    }

    .back:hover {
      color: var(--gold);
    }

    /* MAIN */

    main {
      flex: 1;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 45px 20px;
    }

    .reset-box {
      width: 100%;

      max-width: 480px;

      background: white;

      padding: 35px;

      border-radius: 22px;

      border: 1px solid #e5e7eb;

      box-shadow:
        0 15px 45px rgba(0,0,0,.08);
    }

    /* ICON */

    .icon-box {
      width: 72px;
      height: 72px;

      margin: 0 auto 18px;

      border-radius: 50%;

      background: var(--gold-light);

      display: flex;

      justify-content: center;

      align-items: center;
    }

    .icon-box svg {
      width: 35px;
      height: 35px;

      fill: none;

      stroke: #9a6700;

      stroke-width: 1.7;

      stroke-linecap: round;

      stroke-linejoin: round;
    }

    /* TITLE */

    h1 {
      text-align: center;

      font-size: 27px;

      margin-bottom: 9px;
    }

    .description {
      text-align: center;

      color: var(--muted);

      font-size: 14px;

      line-height: 1.8;

      margin-bottom: 18px;
    }

    /* PHONE */

    .phone {
      display: block;

      width: fit-content;

      max-width: 100%;

      margin: 0 auto 25px;

      background: var(--gold-light);

      border: 1px solid #f2d58a;

      color: #7a5200;

      padding: 7px 15px;

      border-radius: 20px;

      font-size: 14px;

      font-weight: bold;

      direction: ltr;
    }

    /* OTP */

    .otp-title {
      text-align: center;

      font-size: 14px;

      font-weight: bold;

      margin-bottom: 12px;
    }

    .otp-container {
      direction: ltr;

      display: flex;

      justify-content: center;

      gap: 8px;

      margin-bottom: 12px;
    }

    .otp {
      width: 48px;

      height: 55px;

      border: 1px solid var(--border);

      border-radius: 10px;

      text-align: center;

      font-size: 23px;

      font-weight: bold;

      outline: none;

      direction: ltr;
    }

    .otp:focus {
      border-color: var(--gold);

      box-shadow:
        0 0 0 3px rgba(245,158,11,.12);
    }

    /* TIMER */

    .timer {
      text-align: center;

      color: var(--muted);

      font-size: 13px;

      margin-bottom: 22px;
    }

    .timer span {
      color: var(--dark);

      font-weight: bold;
    }

    .resend {
      display: none;

      margin: 0 auto 22px;

      border: none;

      background: transparent;

      color: #9a6700;

      font-family: inherit;

      font-size: 13px;

      font-weight: bold;

      cursor: pointer;
    }

    .resend:hover {
      text-decoration: underline;
    }

    /* PASSWORD */

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;

      font-size: 14px;

      font-weight: bold;

      margin-bottom: 7px;
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      width: 100%;

      padding: 13px;

      padding-left: 62px;

      border: 1px solid var(--border);

      border-radius: 10px;

      font-family: inherit;

      font-size: 15px;

      outline: none;
    }

    .password-box input:focus {
      border-color: var(--gold);

      box-shadow:
        0 0 0 3px rgba(245,158,11,.12);
    }

    .show-password {
      position: absolute;

      left: 8px;

      top: 50%;

      transform: translateY(-50%);

      border: none;

      background: transparent;

      color: var(--muted);

      font-family: inherit;

      font-size: 12px;

      cursor: pointer;
    }

    .password-note {
      color: #98a2b3;

      font-size: 11px;

      margin-top: -8px;

      margin-bottom: 17px;
    }

    /* BUTTON */

    .reset-btn {
      width: 100%;

      border: none;

      background: var(--gold);

      color: var(--dark);

      padding: 14px;

      border-radius: 11px;

      font-family: inherit;

      font-size: 16px;

      font-weight: 900;

      cursor: pointer;

      transition: .2s;
    }

    .reset-btn:hover {
      background: #fbbf24;

      transform: translateY(-1px);
    }

    .reset-btn:disabled {
      opacity: .6;

      cursor: not-allowed;

      transform: none;
    }

    /* MESSAGE */

    .message {
      display: none;

      margin-top: 17px;

      padding: 11px;

      border-radius: 10px;

      text-align: center;

      font-size: 13px;

      line-height: 1.6;
    }

    .error {
      background: var(--red-light);

      color: var(--red);
    }

    .success {
      background: var(--green-light);

      color: var(--green);
    }

    /* FOOTER */

    footer {
      background: var(--dark);

      color: white;

      text-align: center;

      padding: 22px;
    }

    footer p {
      color: #98a2b3;

      font-size: 13px;
    }

    /* MOBILE */

    @media(max-width:500px) {

      header {
        padding: 14px 5%;
      }

      .logo {
        font-size: 27px;
      }

      .reset-box {
        padding: 28px 18px;
      }

      h1 {
        font-size: 24px;
      }

      .otp-container {
        gap: 5px;
      }

      .otp {
        width: 43px;
        height: 52px;
        font-size: 21px;
      }

    }

  </style>

</head>


<body>


  <!-- HEADER -->

  <header>

    <a href="index.html" class="logo">
      Sahba
    </a>

    <a href="login.html" class="back">
      ← تسجيل الدخول
    </a>

  </header>


  <!-- MAIN -->

  <main>

    <div class="reset-box">


      <!-- ICON -->

      <div class="icon-box">

        <svg viewBox="0 0 24 24">

          <rect
            x="3"
            y="11"
            width="18"
            height="10"
            rx="2"
          ></rect>

          <path
            d="M7 11V7a5 5 0 0110 0v4"
          ></path>

          <path d="M12 15v2"></path>

        </svg>

      </div>


      <h1>
        إعادة تعيين كلمة المرور
      </h1>


      <p class="description">
        أدخل كود التحقق الذي تم إرساله
        <br>
        إلى رقم واتساب الخاص بك.
      </p>


      <!-- PHONE -->

      <div
        class="phone"
        id="phoneDisplay"
      >
        جاري تحميل الرقم...
      </div>


      <!-- OTP -->

      <div class="otp-title">
        كود التحقق
      </div>


      <div class="otp-container">

        <input
          class="otp"
          id="otp1"
          type="text"
          inputmode="numeric"
          maxlength="1"
          autocomplete="one-time-code"
        >

        <input
          class="otp"
          id="otp2"
          type="text"
          inputmode="numeric"
          maxlength="1"
        >

        <input
          class="otp"
          id="otp3"
          type="text"
          inputmode="numeric"
          maxlength="1"
        >

        <input
          class="otp"
          id="otp4"
          type="text"
          inputmode="numeric"
          maxlength="1"
        >

        <input
          class="otp"
          id="otp5"
          type="text"
          inputmode="numeric"
          maxlength="1"
        >

        <input
          class="otp"
          id="otp6"
          type="text"
          inputmode="numeric"
          maxlength="1"
        >

      </div>


      <!-- TIMER -->

      <div
        class="timer"
        id="timer"
      >
        يمكنك طلب كود جديد بعد
        <span id="seconds">
          60
        </span>
        ثانية
      </div>


      <button
        class="resend"
        id="resend"
        onclick="resendOTP()"
      >
        إعادة إرسال الكود
      </button>


      <!-- NEW PASSWORD -->

      <div class="input-group">

        <label for="password">
          كلمة المرور الجديدة
        </label>

        <div class="password-box">

          <input
            id="password"
            type="password"
            minlength="6"
            placeholder="6 أحرف على الأقل"
            autocomplete="new-password"
          >

          <button
            type="button"
            class="show-password"
            onclick="togglePassword('password', this)"
          >
            إظهار
          </button>

        </div>

      </div>


      <div class="password-note">
        يجب أن تكون كلمة المرور 6 أحرف أو أرقام على الأقل.
      </div>


      <!-- CONFIRM -->

      <div class="input-group">

        <label for="confirmPassword">
          تأكيد كلمة المرور
        </label>

        <div class="password-box">

          <input
            id="confirmPassword"
            type="password"
            minlength="6"
            placeholder="أعد كتابة كلمة المرور"
            autocomplete="new-password"
          >

          <button
            type="button"
            class="show-password"
            onclick="togglePassword('confirmPassword', this)"
          >
            إظهار
          </button>

        </div>

      </div>


      <!-- BUTTON -->

      <button
        class="reset-btn"
        id="resetButton"
        onclick="resetPassword()"
      >
        تغيير كلمة المرور
      </button>


      <!-- MESSAGES -->

      <div
        class="message error"
        id="errorMessage"
      ></div>


      <div
        class="message success"
        id="successMessage"
      ></div>


    </div>

  </main>


  <!-- FOOTER -->

  <footer>

    <p>
      © 2026 Sahba — جميع الحقوق محفوظة
    </p>

  </footer>


  <script>

    /* =========================
       رقم الهاتف
    ========================= */

    const phone =
      sessionStorage.getItem(
        "sahba_reset_phone"
      );


    if (phone) {

      document.getElementById(
        "phoneDisplay"
      ).textContent = phone;

    } else {

      document.getElementById(
        "phoneDisplay"
      ).textContent =
        "لم يتم تحديد رقم الهاتف";

    }


    /* =========================
       OTP INPUTS
    ========================= */

    const otpInputs =
      document.querySelectorAll(".otp");


    otpInputs.forEach(
      function(input, index) {

        input.addEventListener(
          "input",
          function() {

            this.value =
              this.value.replace(
                /[^0-9]/g,
                ""
              );

            if (
              this.value &&
              index < otpInputs.length - 1
            ) {

              otpInputs[index + 1].focus();

            }

          }
        );


        input.addEventListener(
          "keydown",
          function(event) {

            if (
              event.key === "Backspace" &&
              !this.value &&
              index > 0
            ) {

              otpInputs[index - 1].focus();

            }

          }
        );

      }
    );


    /* =========================
       PASTE OTP
    ========================= */

    otpInputs[0].addEventListener(
      "paste",
      function(event) {

        event.preventDefault();

        const pasted =
          event.clipboardData
            .getData("text")
            .replace(/\D/g, "")
            .slice(0, 6);


        pasted
          .split("")
          .forEach(
            function(number, index) {

              if (otpInputs[index]) {

                otpInputs[index].value =
                  number;

              }

            }
          );


        if (pasted.length === 6) {

          otpInputs[5].focus();

        }

      }
    );


    /* =========================
       TIMER
    ========================= */

    let timeLeft = 60;

    let timerInterval =
      setInterval(
        function() {

          timeLeft--;

          document.getElementById(
            "seconds"
          ).textContent = timeLeft;


          if (timeLeft <= 0) {

            clearInterval(
              timerInterval
            );

            document.getElementById(
              "timer"
            ).style.display = "none";

            document.getElementById(
              "resend"
            ).style.display =
              "block";

          }

        },
        1000
      );


    /* =========================
       RESEND OTP
    ========================= */

    function resendOTP() {

      if (!phone) {

        showError(
          "لا يوجد رقم هاتف لإرسال الكود."
        );

        return;

      }


      /*
        هنا سيتم ربط Backend:

        POST /api/auth/resend-reset-otp

        وإرسال:
        phone
      */


      hideMessages();


      alert(
        "إعادة إرسال OTP ستكون متاحة بعد ربط الـBackend."
      );


      /* إعادة تشغيل العداد */

      timeLeft = 60;

      document.getElementById(
        "seconds"
      ).textContent = timeLeft;

      document.getElementById(
        "timer"
      ).style.display = "block";

      document.getElementById(
        "resend"
      ).style.display = "none";


      clearInterval(
        timerInterval
      );


      timerInterval =
        setInterval(
          function() {

            timeLeft--;

            document.getElementById(
              "seconds"
            ).textContent =
              timeLeft;


            if (timeLeft <= 0) {

              clearInterval(
                timerInterval
              );

              document.getElementById(
                "timer"
              ).style.display =
                "none";

              document.getElementById(
                "resend"
              ).style.display =
                "block";

            }

          },
          1000
        );

    }


    /* =========================
       RESET PASSWORD
    ========================= */

    function resetPassword() {

      hideMessages();


      let otp = "";


      otpInputs.forEach(
        function(input) {

          otp += input.value;

        }
      );


      const password =
        document.getElementById(
          "password"
        ).value;


      const confirmPassword =
        document.getElementById(
          "confirmPassword"
        ).value;


      /* OTP */

      if (otp.length !== 6) {

        showError(
          "من فضلك أدخل كود التحقق المكون من 6 أرقام."
        );

        return;

      }


      /* Password */

      if (password.length < 6) {

        showError(
          "كلمة المرور يجب أن تكون 6 أحرف أو أرقام على الأقل."
        );

        return;

      }


      /* Confirm */

      if (
        password !==
        confirmPassword
      ) {

        showError(
          "كلمتا المرور غير متطابقتين."
        );

        return;

      }


      /*
        هنا سيتم ربط Backend:

        POST /api/auth/reset-password

        البيانات:

        phone
        otp
        password

        والسيرفر هو المسؤول عن:
        - التحقق من OTP
        - التأكد من صلاحيته
        - تحديث كلمة المرور
      */


      const button =
        document.getElementById(
          "resetButton"
        );


      button.disabled = true;

      button.textContent =
        "جاري التحقق...";


      /*
        مؤقتًا فقط للواجهة.
        لا يعتبر هذا تغييرًا حقيقيًا
        لكلمة المرور.
      */

      setTimeout(
        function() {

          showSuccess(
            "تم التحقق من البيانات. بعد ربط الـBackend سيتم تغيير كلمة المرور."
          );

          button.disabled = false;

          button.textContent =
            "تغيير كلمة المرور";

        },
        700
      );

    }


    /* =========================
       PASSWORD VISIBILITY
    ========================= */

    function togglePassword(
      id,
      button
    ) {

      const input =
        document.getElementById(id);


      if (
        input.type ===
        "password"
      ) {

        input.type = "text";

        button.textContent =
          "إخفاء";

      } else {

        input.type = "password";

        button.textContent =
          "إظهار";

      }

    }


    /* =========================
       MESSAGES
    ========================= */

    function showError(message) {

      const box =
        document.getElementById(
          "errorMessage"
        );

      box.textContent = message;

      box.style.display = "block";

      document.getElementById(
        "successMessage"
      ).style.display = "none";

    }


    function showSuccess(message) {

      const box =
        document.getElementById(
          "successMessage"
        );

      box.textContent = message;

      box.style.display = "block";

      document.getElementById(
        "errorMessage"
      ).style.display = "none";

    }


    function hideMessages() {

      document.getElementById(
        "errorMessage"
      ).style.display = "none";

      document.getElementById(
        "successMessage"
      ).style.display = "none";

    }

  </script>


</body>

</html>
